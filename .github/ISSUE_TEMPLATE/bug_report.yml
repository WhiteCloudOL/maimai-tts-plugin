name: 问题反馈
description: 反馈插件报错或使用异常
title: "[BUG] "
body:
  - type: markdown
    attributes:
      value: 请按下面的提示填写，方便定位问题。日志和截图中的 API Key 等凭据请先遮住。
  - type: input
    id: maibot_version
    attributes:
      label: MaiBot 版本
      placeholder: 例如：1.3.6
    validations:
      required: true
  - type: input
    id: plugin_version
    attributes:
      label: 插件版本
      placeholder: 例如：2.0.3
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: 相关 TTS 平台
      placeholder: 例如：BreezeTTS、OpenAI、阿里云_千问；通用问题填写“通用”
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 遇到了什么问题？
      description: 写一下做了什么、出现了什么情况，以及期望的结果
      placeholder: 发送 /mmtts 你好后出现……；期望收到语音
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 相关日志或截图
      description: 粘贴报错附近的日志，或上传截图。日志中带 [TTS] 的内容尤其有帮助
      placeholder: 在这里粘贴日志，或上传截图
    validations:
      required: true
  - type: input
    id: adapter
    attributes:
      label: 使用的适配器（选填）
      placeholder: 例如：QQ 官方、SnowLuma、NapCat
