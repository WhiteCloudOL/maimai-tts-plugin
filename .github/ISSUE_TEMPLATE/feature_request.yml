name: 功能建议
description: 提出使用体验或功能改进建议
title: "[功能建议] "
body:
  - type: input
    id: platform
    attributes:
      label: 相关 TTS 平台
      placeholder: 例如：BreezeTTS、OpenAI、阿里云_千问；通用建议填写“通用”
    validations:
      required: true
  - type: textarea
    id: request
    attributes:
      label: 希望增加或改进什么？
      description: 简单描述需要的功能，以及什么场景下会用到
      placeholder: 我希望……，主要用于……
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: 补充说明（选填）
      description: 可以附参考链接、截图或操作示例
