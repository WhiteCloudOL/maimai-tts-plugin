name: 平台接入申请
description: 申请接入新的 TTS 平台或 API 服务
title: "[平台接入] "
body:
  - type: input
    id: platform_name
    attributes:
      label: 平台名称
      placeholder: 填写平台或项目的名称
    validations:
      required: true
  - type: input
    id: website
    attributes:
      label: 平台官网
      placeholder: https://example.com
      description: 开源项目也可以填写官方仓库地址
    validations:
      required: true
  - type: input
    id: api_docs
    attributes:
      label: API 文档（选填）
      placeholder: 平台公开的接口文档链接
  - type: textarea
    id: extra
    attributes:
      label: 补充说明（选填）
      description: 可以说明希望使用的模型、音色克隆等功能
