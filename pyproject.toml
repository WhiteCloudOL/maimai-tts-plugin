[project]
name = "maimai-openai-tts-plugin"
version = "1.2.0"
description = "MaiBot 的 OpenAI 兼容文本转语音插件"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0" }
authors = [
    { name = "清蒸云鸭" },
]
dependencies = [
    "aiohttp>=3.9.0,<4.0.0",
    "pydantic>=2.0.0,<3.0.0",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "B"]
