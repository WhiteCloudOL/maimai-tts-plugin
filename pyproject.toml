[project]
name = "maimai-tts-plugin"
version = "2.0.3"
description = "MaiBot 多平台 TTS 语音工作台"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0" }
authors = [
    { name = "清蒸云鸭" },
]
dependencies = [
    "aiohttp>=3.9.0,<4.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "av>=14.0.0,<17.0.0",
    "silk-python>=0.2.8,<0.3.0",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "B"]

[dependency-groups]
dev = [
    "maibot-plugin-sdk==2.13.0",
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
