<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>麦麦TTS语音 · 语音工作台</title>
    <style>
      :root {
        color-scheme: light;
        --visible-top: var(--maibot-viewport-top, 0px);
        --visible-height: min(100dvh, var(--maibot-viewport-height, 100dvh));
        --dialog-gap: 16px;
        --shell: var(--maibot-background, #ddd4bf);
        --panel: var(--maibot-surface, #ebe4d2);
        --screen: var(--maibot-soft, #fbf9f0);
        --ink: var(--maibot-foreground, #4a443a);
        --muted: var(--maibot-muted, #5f5849);
        --line: var(--maibot-border, #5a544a);
        --rule: #bdb39c;
        --hi: #f6f1e3;
        --shade: #bdb39c;
        --key: #f3eee1;
        --key-side: #c2b8a1;
        --key-hi: #fffaf0;
        --green: #8fd6a0;
        --green-ink: #2f3a2b;
        --green-side: #5fa873;
        --accent: var(--maibot-primary, #f08a5d);
        --danger: #c2452f;
        --scope: #403c37;
        --scope-ink: #ded7c4;
        --radius: var(--maibot-radius, 0px);
        --shadow:
          inset 2px 2px 0 var(--hi), inset -2px -2px 0 var(--shade),
          0 5px 0 #9c927b;
        --font: var(
          --maibot-font-body,
          "Microsoft YaHei",
          "PingFang SC",
          sans-serif
        );
        --display: var(--maibot-font-display, var(--font));
        --mono: var(--maibot-font-mono, "Cascadia Code", Consolas, monospace);
      }
      .tone-settings {
        border-top: 1px solid var(--rule);
        margin-top: 12px;
        padding-top: 20px;
        min-width: 0;
      }
      .tone-settings > .muted {
        margin: 8px 0 18px;
        line-height: 1.7;
      }
      .tone-settings fieldset {
        border: 1px solid var(--rule);
        border-radius: 0;
        padding: 14px;
        margin: 0;
        min-width: 0;
      }
      .tone-settings input[type="checkbox"] {
        accent-color: var(--green-side);
        width: 16px;
        height: 16px;
      }
      .tone-settings legend {
        padding: 0 7px;
        font-weight: 600;
      }
      .tone-settings fieldset .inline-check {
        min-height: 36px;
        padding-right: 12px;
      }
      :root.dark {
        color-scheme: dark;
        --shell: var(--maibot-background, #2f2c28);
        --panel: var(--maibot-surface, #3a3631);
        --screen: var(--maibot-soft, #1e221e);
        --ink: var(--maibot-foreground, #ebe4d2);
        --muted: var(--maibot-muted, #b5ad9a);
        --line: var(--maibot-border, #171513);
        --rule: #2a2723;
        --hi: #4a453f;
        --shade: #2a2723;
        --key: #4d4841;
        --key-side: #2e2b27;
        --key-hi: #5d574f;
        --green-ink: #1f2a20;
        --danger: #efa18c;
        --scope: #1e221e;
        --scope-ink: #ded7c4;
        --shadow:
          inset 2px 2px 0 var(--hi), inset -2px -2px 0 var(--shade),
          0 5px 0 #1d1b18;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 24px;
        color: var(--ink);
        font: 14px/1.65 var(--font);
      }
      html {
        scrollbar-gutter: stable;
      }
      html.modal-open {
        overflow: hidden;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
      }
      button:disabled {
        cursor: wait;
        opacity: 0.55;
      }
      button,
      input,
      select,
      textarea,
      a {
        outline-offset: 4px;
      }
      button:focus-visible,
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible,
      a:focus-visible {
        outline: 2px solid var(--green-ink);
      }
      :root.dark :focus-visible {
        outline-color: var(--green);
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      h1 {
        font-family: var(--display);
        font-size: 30px;
        font-weight: 400;
        line-height: 1.25;
        letter-spacing: 0.04em;
      }
      h2 {
        font-family: var(--display);
        font-size: 22px;
        font-weight: 400;
        letter-spacing: 0.03em;
      }
      h3 {
        font-size: 15px;
        font-weight: 650;
      }
      small,
      .muted {
        color: var(--muted);
      }
      small {
        font-size: 12px;
      }
      a {
        color: var(--green-ink);
      }
      :root.dark a {
        color: var(--green);
      }
      svg {
        display: block;
      }
      .mono {
        font-family: var(--mono);
      }
      .overline {
        font: 11px/1.5 var(--mono);
        letter-spacing: 1.7px;
        color: var(--muted);
        text-transform: uppercase;
      }
      .shell {
        max-width: 1320px;
        margin: auto;
      }
      .top {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: center;
        gap: 22px;
        padding: 4px 0 24px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 17px;
      }
      .brand-icon {
        display: grid;
        place-items: center;
        flex-shrink: 0;
        width: 54px;
        height: 54px;
        background: var(--green);
        border: 2px solid var(--line);
        border-radius: var(--radius);
        box-shadow:
          inset 2px 2px 0 #ffffff55,
          inset 0 -5px 0 var(--green-side);
        color: var(--green-ink);
      }
      .top p {
        margin-top: 7px;
        color: var(--muted);
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
      }
      .key {
        gap: 8px;
        min-height: 40px;
        max-width: 100%;
        white-space: normal;
        overflow-wrap: anywhere;
        transition:
          transform 60ms ease-out,
          background-color 120ms ease-out;
      }
      .key:hover {
        transform: none;
      }
      .key:active {
        transform: translateY(2px);
      }

      .key.danger {
        color: var(--danger);
      }
      .key.small {
        min-height: 32px;
        padding-inline: 12px;
        font-size: 12px;
      }
      .key.flat {
        border-color: transparent;
        box-shadow: none;
        background: transparent;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        white-space: nowrap;
      }
      .badge.green {
        color: var(--green-ink);
        background: var(--green);
      }
      .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
      }
      .summary {
        display: grid;
        grid-template-columns: 1.3fr 1fr 1fr;
        gap: 15px;
        margin-bottom: 24px;
      }
      .meter {
        padding: 18px 20px;
        position: relative;
        overflow: hidden;
      }
      .meter strong {
        display: block;
        font-family: var(--display);
        font-size: 24px;
        line-height: 1.4;
        margin: 7px 0 3px;
        font-weight: 400;
      }
      .meter:first-child {
        background: var(--scope);
        color: var(--scope-ink);
        border: 2px solid var(--line);
        box-shadow:
          inset 3px 3px 0 #0003,
          -2px -2px 0 2px var(--shade),
          2px 2px 0 2px var(--hi);
      }
      .meter:first-child small,
      .meter:first-child .overline {
        color: #adc8a6;
      }
      .wave {
        position: absolute;
        right: 15px;
        bottom: 16px;
        display: flex;
        align-items: center;
        gap: 4px;
        height: 45px;
        opacity: 0.42;
      }
      .wave i {
        width: 4px;
        background: var(--scope-ink);
        border-radius: 3px;
        height: var(--h);
        animation: pulse 1.5s ease-in-out infinite alternate;
        animation-delay: var(--d);
      }
      @keyframes pulse {
        to {
          transform: scaleY(0.5);
          opacity: 0.55;
        }
      }
      .nav {
        display: flex;
        gap: 8px;
        margin-bottom: 22px;
        padding-bottom: 16px;
        border-bottom: 2px solid var(--rule);
        box-shadow: 0 2px 0 var(--hi);
        overflow-x: auto;
      }
      .nav button {
        flex-shrink: 0;
        height: 40px;
        padding: 0 14px 3px;
      }
      .nav button[aria-selected="true"] {
        background: var(--green);
        color: var(--green-ink);
        border: 2px solid var(--line);
        box-shadow: inset 0 -1px 0 var(--green-side);
        transform: none;
      }
      .nav .num {
        font: 11px var(--mono);
        opacity: 0.55;
        margin-right: 4px;
      }
      .view {
        animation: enter 0.25s ease-out;
      }
      @keyframes enter {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .workspace {
        display: grid;
        grid-template-columns: 235px minmax(0, 1fr);
        gap: 20px;
      }
      .workspace > *,
      .route-grid > *,
      .two-columns > *,
      .features-grid > * {
        min-width: 0;
      }
      .panel {
        min-width: 0;
      }
      .panel-body {
        padding: 24px;
      }
      .panel-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 15px;
        padding: 16px 22px;
        border-bottom: 2px solid var(--rule);
        box-shadow: 0 2px 0 var(--hi);
      }
      .panel-head p {
        font-size: 12px;
        color: var(--muted);
        margin-top: 3px;
      }
      .provider-list {
        padding: 9px;
      }
      .field.provider-picker {
        display: none;
      }
      .provider-btn {
        width: 100%;
        display: flex;
        gap: 11px;
        align-items: center;
        justify-content: flex-start;
        text-align: left;
        margin-bottom: 8px;
        min-height: 62px;
        padding: 10px 12px;
        transition:
          transform 60ms ease-out,
          background-color 120ms ease-out;
      }
      .provider-btn:hover {
        transform: none;
      }
      .provider-btn[aria-current="true"] {
        background: var(--green);
        border: 2px solid var(--line);
        box-shadow: inset 0 -1px 0 var(--green-side);
        color: var(--green-ink);
        transform: translateY(2px);
      }
      .provider-btn strong {
        display: block;
        font-size: 13px;
        font-weight: 600;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .provider-btn small {
        display: block;
        font-size: 10px;
      }
      .mark {
        flex-shrink: 0;
        display: grid;
        place-items: center;
        width: 34px;
        height: 34px;
        border: 2px solid var(--line);
        border-radius: var(--radius);
        box-shadow: inset 2px 2px 0 #00000014;
        font: 11px var(--mono);
        color: var(--provider-color, var(--muted));
        background: var(--screen);
      }
      .provider-btn.off {
        opacity: 0.55;
      }
      .list-top {
        padding: 17px 17px 6px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .list-bottom {
        padding: 7px 15px 17px;
      }
      .list-bottom .key {
        width: 100%;
      }
      .helper {
        padding: 15px 4px;
        color: var(--muted);
        font-size: 12px;
      }
      .subtabs {
        display: flex;
        gap: 8px;
        padding: 14px 22px;
        border-bottom: 2px solid var(--rule);
        box-shadow: 0 2px 0 var(--hi);
        overflow-x: auto;
      }
      .subtabs button {
        white-space: nowrap;
        flex-shrink: 0;
        height: 36px;
        padding: 0 12px 3px;
        font-size: 12px;
      }
      .subtabs button[aria-selected="true"] {
        background: var(--green);
        color: var(--green-ink);
        border: 2px solid var(--line);
        box-shadow: inset 0 -1px 0 var(--green-side);
        transform: none;
      }
      .form-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 19px 22px;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
        min-width: 0;
      }
      .field.wide,
      .form-grid > .wide {
        grid-column: 1/-1;
      }
      .field label {
        font-size: 12px;
        font-weight: 600;
      }
      .input {
        width: 100%;
        min-width: 0;
        min-height: 40px;
        transition: outline-color 120ms ease-out;
      }
      .input:focus {
        outline: 2px solid var(--green-side);
        outline-offset: 1px;
      }
      .input.mono {
        font-family: var(--mono);
        font-size: 13px;
      }
      .credential-input {
        position: relative;
      }
      .credential-input > .input {
        padding-inline-end: 104px;
      }
      .credential-input > .credential-clear {
        position: absolute;
        inset-inline-end: 4px;
        top: 4px;
        bottom: 4px;
        width: 90px;
        min-height: 32px;
        padding: 0 8px;
        font-size: 12px;
      }
      textarea.input {
        resize: vertical;
        min-height: 97px;
        line-height: 1.7;
      }
      .field small {
        font-size: 11px;
        line-height: 1.6;
      }
      .input-row {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .input-row > .input {
        min-width: 0;
        flex: 1;
      }
      .note {
        padding: 12px 14px;
        border-left: 3px solid var(--accent);
        background: var(--screen);
        font-size: 12px;
        color: var(--muted);
        line-height: 1.8;
        border-radius: var(--radius);
        margin-bottom: 22px;
      }
      .section-title {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
        margin-bottom: 15px;
      }
      .section-title small {
        font: 10px var(--mono);
        letter-spacing: 1px;
      }
      .split {
        margin: 24px 0;
        border: 0;
        border-top: 1px solid var(--line);
      }
      .switch-label {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 12px;
        cursor: pointer;
      }
      .switch {
        appearance: none;
        flex-shrink: 0;
        width: 40px;
        height: 24px;
        margin: 0;
        border: 2px solid var(--line);
        border-radius: var(--radius);
        background: var(--screen);
        box-shadow: inset 2px 2px 0 #00000029;
        position: relative;
        cursor: pointer;
        transition: background-color 120ms ease-out;
      }
      .switch:before {
        content: "";
        position: absolute;
        left: 2px;
        top: 2px;
        width: 16px;
        height: 16px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--key);
        box-shadow:
          inset 1px 1px 0 var(--key-hi),
          inset 0 -2px 0 var(--key-side);
        transition: transform 120ms ease-out;
      }
      .switch:checked {
        background: var(--green);
        border-color: var(--line);
      }
      .switch:checked:before {
        transform: translateX(16px);
      }
      .toggle-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        padding: 15px 0;
        border-bottom: 1px solid var(--line);
      }
      .toggle-row:last-child {
        border-bottom: 0;
      }
      .toggle-row p {
        font-size: 12px;
        color: var(--muted);
        margin-top: 4px;
      }
      .toggle-row h3 {
        font-size: 13px;
      }
      .empty {
        padding: 55px 30px;
        text-align: center;
      }
      .empty h2 {
        margin: 10px 0;
      }
      .empty p {
        max-width: 390px;
        margin: 0 auto 22px;
        color: var(--muted);
        font-size: 13px;
      }
      .empty-symbol {
        font: 44px var(--mono);
        color: #8caa82;
      }
      .editor-foot {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 15px;
        padding: 16px 24px;
        border-top: 1px solid var(--line);
      }
      .route-grid {
        display: grid;
        grid-template-columns: minmax(0, 1.4fr) minmax(240px, 0.8fr);
        gap: 22px;
      }
      .route-slot {
        display: flex;
        gap: 14px;
        align-items: center;
        padding: 16px;
        background: var(--screen);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        margin-bottom: 10px;
      }
      .route-slot .order {
        display: grid;
        place-items: center;
        flex-shrink: 0;
        width: 28px;
        height: 28px;
        font: 12px var(--mono);
        background: var(--green);
        color: var(--green-ink);
        border-radius: 5px;
      }
      .route-slot .route-name {
        flex: 1;
        min-width: 0;
      }
      .route-slot strong {
        font-size: 13px;
      }
      .route-slot small {
        display: block;
      }
      .route-controls {
        display: flex;
        gap: 5px;
      }
      .route-guide {
        font-size: 13px;
        color: var(--muted);
        line-height: 1.9;
      }
      .route-guide li {
        padding: 8px 0;
      }
      .choice-toolbar,
      .choice-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
      }
      .choice-toolbar {
        margin: 14px 0;
      }
      .choice-list {
        display: grid;
        gap: 7px;
        padding: 3px;
      }
      .choice-row {
        display: grid;
        grid-template-columns: 20px minmax(0, 1fr);
        gap: 12px;
        align-items: center;
        padding: 13px;
        border: 1px solid var(--line);
        background: var(--screen);
        cursor: pointer;
      }
      .choice-row:has(input:checked) {
        background: var(--green);
        color: var(--green-ink);
      }
      .choice-row:has(input:checked) small {
        color: var(--green-ink);
      }
      .choice-row:focus-within {
        outline: 2px solid var(--green-side);
        outline-offset: 1px;
      }
      .choice-row input {
        accent-color: var(--ink);
        width: 16px;
        height: 16px;
        margin: 0;
      }
      .choice-row strong,
      .choice-row small {
        display: block;
        overflow-wrap: anywhere;
      }
      .choice-row strong {
        font-size: 13px;
      }
      .choice-row small {
        font: 11px var(--mono);
        margin-top: 4px;
      }
      .choice-footer {
        margin-top: 18px;
        padding-top: 16px;
        border-top: 1px solid var(--line);
      }
      .model-library {
        display: grid;
        gap: 8px;
        max-height: 320px;
        overflow: auto;
        margin-top: 14px;
        overscroll-behavior: contain;
      }
      .model-row {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        align-items: center;
        padding: 12px;
        border: 1px solid var(--line);
        background: var(--screen);
        content-visibility: auto;
        contain-intrinsic-size: auto 76px;
      }
      .model-row .model-copy {
        flex: 1;
        min-width: 140px;
        overflow-wrap: anywhere;
      }
      .model-row strong,
      .model-row small {
        display: block;
      }
      .model-row strong {
        font-size: 12px;
      }
      .model-row small {
        font: 10px var(--mono);
        margin-top: 4px;
      }
      .choice-manual {
        margin-top: 18px;
      }
      .choice-manual summary {
        cursor: pointer;
        font-size: 12px;
      }
      .choice-empty {
        padding: 30px 14px;
        text-align: center;
        color: var(--muted);
        font-size: 12px;
      }
      .voice-list {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 9px;
        margin: 14px 0;
      }
      .voice-item {
        padding: 11px;
        border: 1px solid var(--line);
        background: var(--screen);
        border-radius: var(--radius);
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .voice-item .voice-copy {
        flex: 1;
        min-width: 0;
      }
      .voice-item strong,
      .voice-item small {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .voice-item strong {
        font-size: 12px;
      }
      .voice-item small {
        font: 10px var(--mono);
        margin-top: 3px;
      }
      .two-columns {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 23px;
      }
      .preview-screen {
        background: var(--scope);
        border-radius: var(--radius);
        padding: 28px;
        min-height: 170px;
        color: var(--scope-ink);
        position: relative;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .preview-screen .overline {
        color: #9bb395;
      }
      .preview-screen strong {
        font-size: 20px;
        margin: 13px 0 5px;
      }
      .preview-screen p {
        font-size: 12px;
        opacity: 0.75;
      }
      .preview-screen .wave {
        right: 30px;
        opacity: 0.25;
      }
      .audio-area {
        margin-top: 20px;
      }
      audio {
        width: 100%;
        height: 42px;
      }
      .activity {
        display: flex;
        gap: 12px;
        align-items: flex-start;
        padding: 14px 0;

      let toastTimer, dialogResolve;

      function showError(message) {
        if (

          $("#view .error-panel")

          .querySelectorAll(".operation-error")
          .forEach((el) => el.remove());
        const box = document.createElement("div");

        const openDialog = document.querySelector("dialog[open] .dialog-body");

          document.querySelector(".prompt-dialog[open] .prompt-edit-help") || openDialog ||
          document.querySelector("#view .panel-body") ||

          button.disabled = !state.job || state.cancelling;
          button.textContent = state.cancelling ? "正在取消…" : "取消任务";

        const el = $("#dirty");
        el.textContent = state.saving

          : state.dirty
            ? "有未保存的更改"
            : "所有更改已保存";
        el.classList.toggle("changed", state.dirty);
        document.querySelectorAll("[data-save]").forEach((button) => {
          button.disabled =
            !state.config ||
            !(button.dataset.save === "routing" ? routingChanged() : state.dirty) ||
            state.saving || state.busy;
          button.textContent = state.saving
            ? "正在保存…"
            : button.dataset.save === "profile"
              ? "保存此平台"
              : button.dataset.save === "routing"
                ? "保存语音路由"
                : "保存全部设置 ↗";
        });
        updateRoutingStatus();
        $("#footer-state").textContent = state.busy
          ? "TASK RUNNING"

            : "READY";

      function current() {

        const p = config.profiles.find(
          (v) => v.id === target?.provider_id,

        return p
          ? `${p.name}/${target.model_id || "待配置模型"}`
          : "选择服务商/模型";
      }
      function routingValues(config) {
        return { primary: config.primary, fallbacks: config.fallbacks };

        return state.config && state.savedConfig &&
          JSON.stringify(routingValues(state.config)) !==
            JSON.stringify(routingValues(state.savedConfig));

        const status = $("#routing-status");

            throw Error("请选择 1–100 个模型。");
          const used = [
            ...(state.config.primary ? [state.config.primary] : []),
            ...state.config.fallbacks,
          ].some(
            (v) => v.provider_id === p.id && !picker.selected.has(v.model_id),
          );
          if (used)
            throw Error(
              "整体路由正在使用其中的模型，请先调整路由后再移出模型库。",
            );
          const old = new Map(p.models.map((m) => [m.id, m]));
          p.models = picker.candidates
            .filter((m) => picker.selected.has(m.id))
            .map(
              (m) =>
                old.get(m.id) ||
                newModel(p, m.id, m.name === m.id ? "" : m.name),
            );
          p.voices = p.voices.filter(
            (v) => !v.model || picker.selected.has(v.model),
          );
          if (!picker.selected.has(p.model)) {
            const first = p.models[0];
            p.model = first.id;
            p.voice = first.voice;
            if (first.endpoint) p.endpoint = first.endpoint;
          }
          if (!picker.selected.has(state.voiceModels[p.id]))
            state.voiceModels[p.id] = p.model;
        } else if (picker.kind === "voices") {
          const routes = [
            ...(state.config.primary ? [state.config.primary] : []),
            ...state.config.fallbacks,
          ];
          if (
            routes.some(
              (target) =>
                target.provider_id === p.id &&
                target.model_id === picker.model &&
                target.voice &&
                p.voices.some(
                  (v) =>
                    v.id === target.voice &&
                    (!v.model || v.model === picker.model),
                ) &&
                !picker.selected.has(target.voice),
            )
          )
            throw Error(
              "整体路由正在使用其中的音色，请先调整路由后再移出收藏。",
            );
          const others = p.voices.filter(
            (v) => v.model && v.model !== picker.model,
          );
          const choices = picker.candidates
            .filter((v) => picker.selected.has(v.id))
            .map((v) => ({ ...v, model: picker.model }));
          if (others.length + choices.length > 100)
            throw Error("每个平台最多收藏 100 个音色，请调整所选项。");
          p.voices = [...others, ...choices];
          const active = p.models.find((m) => m.id === picker.model),
            previous = active?.voice ?? p.voice;
          if (!picker.selected.has(previous))
            setModelVoice(p, picker.model, choices[0]?.id || "");
        } else {
          const id = [...picker.selected][0];
          if (!id) throw Error("请先选择一个参考音频文件。");
          setReferenceFile(p, id);
        }
        if (state.voiceWorkspace) markVoiceEdited();
        else dirty();
        finishPicker(true);
        notify(
          picker.kind === "files"
            ? "已填入参考音频文件。"
            : "所选项已应用到当前编辑，可继续配置并保存。",
        );

      async function enableProbabilityTone(input) {
        const config = state.config, changes = [], supported = [], unsupported = [];
        const list = (items) => `<ul class="tone-route-list">${items.map((label) => `<li>${h(label)}</li>`).join("")}</ul>`;
        // 按实际首选与备选路由解析音色覆盖，避免误改平台当前编辑的其他模型。
        for (const route of [config.primary, ...config.fallbacks].filter(Boolean)) {
          const root = config.profiles.find((p) => p.id === route.provider_id),
            model = root?.models.find((m) => m.id === (route.model_id || root.model));
          if (!root?.enabled || !model) {
            unsupported.push(`${root?.name || route.provider_id} / ${route.model_id || root?.model || "未配置模型"}（服务商或模型不可用）`);
            continue;

            voice = root.voices.find((v) => v.id === id && (!v.model || v.model === model.id)),
            cap = toneCapability(p, id, voice?.resource_id || p.options.resource_id),
            label = `${root.name} / ${model.name || model.id}${voice ? " / " + voice.name : id ? " / " + id : ""}`;
          if (!cap || (p.kind === "compatible" && protocolFor(p).mode === "custom" && !supportsVoiceStyle(p, id))) {
            unsupported.push(label);
            continue;
          }
          supported.push(label);
          const tone = structuredClone(voice?.tone || p.tone);
          if (tone.mode === "dynamic") continue;
          tone.mode = "dynamic";
          if (!cap.tones.includes(tone.emotion)) tone.emotion = cap.tones[0];
          tone.allowed = tone.allowed.filter((value) => cap.tones.includes(value));
          if (tone.allowed.length && !tone.allowed.includes(tone.emotion)) tone.allowed.push(tone.emotion);
          changes.push({root, model, p, voice, tone});

          return;

              '<p class="muted">保存全部设置后生效；关闭此开关保留模型和音色的语调设置。</p>',
            confirmLabel: changes.length ? "开启并同步语调" : "开启",

            new TextEncoder().encode(
              JSON.stringify({ payload, revision: state.config.revision }),

      async function runJob(operation, args = {}) {
        if (state.busy) throw Error("请等待当前任务完成。");

        state.config.profiles.forEach(rememberModel);
        state.busy = true;
        setDialogBusy(
          true,
          operation === "clone"
            ? "正在创建平台音色…"
            : operation === "voices"
              ? "正在同步平台音色…"
              : "正在处理…",
        );
        updateSave();
        render();
        let launched = false;
        try {
          const targetId = args.profile_id ?? state.selected;
          const draft =
            state.modelEditor && targetId === state.modelEditor.profile.id
              ? objectDraft(operation === "preview")
              : operation === "preview" && !targetId
                ? state.config
                : state.config.profiles.find((p) => p.id === targetId);
          const launchArgs = {
            operation,
            profile_id: targetId,
            ...args,
            draft: JSON.stringify(draft),
          };
          if (
            new TextEncoder().encode(JSON.stringify(launchArgs)).length > 64000
          )
            throw Error("当前设置过大，请减少音色收藏后重试。");
          const started = await maibot.action("launch", launchArgs);
          state.job = started.job_id;
          updateSave();
          $("#dialog #task-status button")?.focus({ preventScroll: true });
          launched = true;
          let result;
          while (true) {
            result = await maibot.query("job", {
              job_id: state.job,
              offset: 0,
            });
            if (result.state === "error") throw Error(result.error);
            if (result.state === "cancelled") throw Error("任务已取消");
            if (result.state === "done") break;
            await new Promise((resolve) => setTimeout(resolve, 900));
          }
          if (result.audio !== undefined) {
            const chunks = [];
            let next = 0;
            while (true) {
              if (result.next_offset <= next && next < result.total)
                throw Error("音频读取未取得进展，请重新试听。");
              chunks.push(
                Uint8Array.from(atob(result.audio), (c) => c.charCodeAt(0)),
              );
              next = result.next_offset;
              if (next >= result.total) break;
              result = await maibot.query("job", {
                job_id: state.job,
                offset: next,
              });
            }
            if (state.audioUrl) URL.revokeObjectURL(state.audioUrl);
            state.audioUrl = URL.createObjectURL(
              new Blob(chunks, { type: result.content_type }),
            );
            state.audioFormat = result.format;
            const p = state.config.profiles.find(
              (p) => p.id === result.provider_id,
            );
            state.previewInfo = `${p?.name || "语音"} · ${result.format.toUpperCase()} · ${(result.total / 1024).toFixed(1)} KB`;
            state.previewError = "";
          }
          return result.result;
        } finally {
          if (launched && ["clone", "design", "update_voice", "delete_voice", "clone_status"].includes(operation))
            state.remoteVoices = {};
          state.job = "";
          updateSave();
          if (launched) {
            try {
              const fresh = await maibot.query("state");
              state.history = fresh.history;
              state.cache = fresh.cache;
            } catch (e) {
              notify("任务结束，但刷新状态失败：" + e.message, true);
            }
          }
          state.cancelling = false;
          state.busy = false;
          setDialogBusy(false);
          render();
          syncSelects();
        }
      }

          p.models.forEach((model) => {
            if (model.parameters) {
              model.parameters.options.breeze_api_mode = value;
              if (value !== "self_hosted" && model.parameters.options.breeze_mode === "saved") model.parameters.options.breeze_mode = "reference";
              if (!cloud) { model.parameters.response_format = "wav"; model.parameters.speed = 1; }
            }
          });
          if (!cloud) { p.response_format = "wav"; p.speed = 1; }
          if (value !== "self_hosted" && p.options.breeze_mode === "saved") p.options.breeze_mode = "reference";
          invalidateProfileLists(p.id);
          dirty(); render(); return;
        }
        if (key === "api_key") syncApiKeyControl();
        if (key === "base_url") {
          target.models.forEach((m) => {
            if (m.endpoint === target.endpoint) m.endpoint = "";
          });
          target.endpoint = "";
          clearPresetEndpoints(target);
        }
        if (key.startsWith("options.reference_")) {
          const scoped = state.subtab === "voices" ? voiceTarget() : current(),
            selected = editingProfile().voices.find(
              (v) =>
                v.id === scoped.voice && (!v.model || v.model === scoped.model),
            );
          if (selected?.reference) {
            const ref = selected.reference,
              field = parts.at(-1);
            if (field === "reference_source") ref.source = value;
            if (field === "reference_file" || field === "reference_path")
              ref.path = value;
            if (field === "reference_url") ref.url = value;
            if (field === "reference_text") ref.text = value;
          }
        }
        if (key === "options.reference_source") {
          document.querySelectorAll("[data-reference-form]").forEach((el) => {
            el.innerHTML = referenceFields(
              state.subtab === "voices" ? voiceTarget() : current(),
              el.dataset.referenceForm,
            );
          });
        }
        if (key === "response_format" && current()?.kind === "siliconflow") {
          const p = current();
          if (value === "opus") p.options.sample_rate = 48000;
          else if (p.options.sample_rate === 48000)
            p.options.sample_rate = 44100;
        }
        dirty();
        if (key === "feature.delivery_format") {
          render();
          return;
        }
        if (["name", "model", "voice"].includes(key)) renderSummary();
        if (el.type === "checkbox" && key === "enabled") {
          if (!value) removeFromRoute(current().id);
          render();
          syncSelects();
        }
      }
      document.addEventListener("input", (e) => {
        if (state.busy || state.saving) return;
        if (e.target.matches("[data-tone-entry-field]")) {
          try { updateToneEntry(e.target); } catch (error) { showError(error.message); }
          return;
        }
        if (e.target.matches("[data-prompt-editor]")) {
          updatePromptOverride(e.target.value);
          return;
        }
        if (e.target.dataset.timbreIndex !== undefined && state.modelEditor) {
          const el = e.target;
          state.modelEditor.profile.options.timbre_weights[Number(el.dataset.timbreIndex)][el.dataset.timbreField] =
            el.dataset.timbreField === "weight" ? Number(el.value) : el.value;
          state.modelEditor.changed = true;
        }
        if (e.target.matches("[data-model-name]") && state.modelEditor) {
          state.modelEditor.name = e.target.value;
          state.modelEditor.changed = true;
        }
        if (state.busy || state.saving) return;
        if (e.target.id === "voice-preset-search" && state.voiceWorkspace) {
          state.voiceWorkspace.search = e.target.value;
          state.voiceWorkspace.page = 0;
          renderWorkspacePresets();
        }
        if (e.target.dataset.voiceProperty && state.voiceEditor)
          state.voiceEditor.voice[e.target.dataset.voiceProperty] =
            e.target.value;
        if (e.target.dataset.voiceProperty) markVoiceEdited();
        if (e.target.id === "choice-search" && state.picker) {
          state.picker.search = e.target.value;
          state.picker.page = 0;
          renderChoices();
        }
        if (e.target.matches("[data-field]")) updateField(e.target);
        if (e.target.id === "preview-text") {
          state.previewText = e.target.value;
          $("#text-count").textContent = state.previewText.length;
        }
      });
      document.addEventListener("change", (e) => {
        const el = e.target;
        if (state.busy || state.saving) return;
        if (el.id === "prompt-platform") {
          state.promptPlatform = el.value;
          render();
          $("#prompt-platform").focus({preventScroll: true});
          return;
        }
        if (el.id === "provider-picker") {
          state.selected = el.value;
          render();
          $("#provider-picker").focus({ preventScroll: true });
          return;
        }
        if (el.dataset.voiceProperty && state.voiceEditor) {
          state.voiceEditor.voice[el.dataset.voiceProperty] = el.value;
          markVoiceEdited();
          if (el.dataset.voiceProperty === "resource_id") {
            showVoiceWorkspace();
            return;
          }
        }
        if (el.dataset.presetVoice !== undefined) {
          const set =
            state.voiceWorkspace.selections[state.modelEditor.profile.model];
          if (el.checked) set.add(el.dataset.presetVoice);
          else set.delete(el.dataset.presetVoice);
          markVoiceEdited();
          renderWorkspacePresets(false);
        }
        if (el.matches("[data-workspace-model]"))
          selectVoiceCategory(state.voiceWorkspace.category, el.value);
        if (el.matches("[data-voice-object]"))
          state.voiceEditor.voice.custom_voice = el.checked;
        if (el.matches("[data-voice-object]")) markVoiceEdited();
        if (el.matches("[data-clone-method]")) {
          const editor = state.voiceEditor;
          editor.cloneMethod = el.value;
          editor.remoteCreated = false;
          editor.voice.id =
            el.value === "dynamic"
              ? "reference_" + Date.now().toString(36)
              : "";
          showVoiceWorkspace();
        }
        if (el.matches("[data-voice-reference]") && state.voiceEditor) {
          state.voiceEditor.useReference = el.checked;
          if (el.checked && !state.voiceEditor.voice.id)
            state.voiceEditor.voice.id = "reference_" + Date.now().toString(36);
          if (
            !el.checked &&
            state.voiceEditor.voice.id.startsWith("reference_")
          )
            state.voiceEditor.voice.id = "";
          showVoiceDialog();
        }
        if (el.dataset.routeVoice !== undefined) {
          const target =
            el.dataset.routeVoice === "primary"
              ? state.config.primary
              : state.config.fallbacks[+el.dataset.routeVoice];
          target.voice = el.value || null;
          dirty();
          renderSummary();
        }
        if (el.matches("[data-choice]") && state.picker) {
          const picker = state.picker,
            id = picker.candidates[+el.dataset.choice].id;
          if (["files", "routes"].includes(picker.kind))
            picker.selected.clear();
          if (el.checked) picker.selected.add(id);
          else picker.selected.delete(id);
          $("#choice-count").textContent =
            `已选 ${picker.selected.size} 项 · 筛选 ${filteredChoices().length} 项`;
        }
        if (el.matches("[data-voice-model]")) {
          state.voiceModels[current().id] = el.value;
          render();
        }
        if (el.matches("select[data-field]")) updateField(el);
        if (
          state.modelEditor &&
          (el.dataset.field === "model" ||
            el.dataset.field === "options.resource_id" ||
            el.dataset.field === "options.clone_resource_id" ||
            el.dataset.voiceProperty === "id" ||
            el.dataset.voiceProperty === "resource_id")
        ) {
          const scope = state.voiceEditor ? "voice" : "model",
            section = document.querySelector(`[data-tone-form="${scope}"]`);
          if (section) section.outerHTML = toneForm(state.modelEditor.profile, scope);
          refreshStyleControls();
        }
        if (el.id === "preview-profile") {
          state.previewProfile = el.value;
          state.previewModel = "";
          render();
          syncSelects();
        }
        if (el.id === "preview-model") state.previewModel = el.value;
      });
      document.addEventListener("keydown", (e) => {
        if (state.promptDialog && (e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") {
          e.preventDefault();
          if (!state.saving && !state.busy) void handlers["save-prompt"]();
          return;
        }
        const category = e.target.closest("[data-voice-category]");
        if (
          category &&
          ["ArrowLeft", "ArrowRight", "Home", "End"].includes(e.key)
        ) {
          e.preventDefault();
          const choices = voiceCategories(state.modelEditor.profile),
            index = choices.findIndex(
              (v) => v[0] === category.dataset.voiceCategory,
            );
          const next =
            e.key === "Home"
              ? 0
              : e.key === "End"
                ? choices.length - 1
                : (index + (e.key === "ArrowRight" ? 1 : -1) + choices.length) %
                  choices.length;
          selectVoiceCategory(choices[next][0]);
          $("#voice-tab-" + choices[next][0]).focus({ preventScroll: true });
          return;
        }
        const el = e.target.closest(".nav [role='tab']");
        if (el && ["ArrowLeft", "ArrowRight", "Home", "End"].includes(e.key)) {
          e.preventDefault();
          const tabs = [...document.querySelectorAll(".nav [role='tab']")];
          let i = tabs.indexOf(el);
          i =
            e.key === "Home"
              ? 0
              : e.key === "End"
                ? tabs.length - 1
                : (i + (e.key === "ArrowRight" ? 1 : -1) + tabs.length) %
                  tabs.length;
          state.tab = tabs[i].dataset.tab;
          render();
          syncSelects();
          tabs[i].focus();
        }
      });
      $("#dialog").addEventListener("cancel", (event) => {
        event.preventDefault();
        if (!state.busy && !state.saving) backFromDialog();
      });
      window.addEventListener("beforeunload", (e) => {
        if (state.dirty || state.modelEditor?.changed) {
          e.preventDefault();
          e.returnValue = "";
        }
        if (state.audioUrl) URL.revokeObjectURL(state.audioUrl);
      });
      document.addEventListener("error", (event) => {
        const audio = event.target;
        if (
          audio.tagName !== "AUDIO" ||
          audio.src !== state.audioUrl ||
          !audio.error ||
          audio.error.code === 1
        ) return;
        const message = "浏览器无法播放返回的音频，请检查音频内容与输出格式，可选择 WAV 或 MP3 后重新试听。";
        const monitor = $("#view .preview-screen strong");
        if (monitor) monitor.textContent = "试听播放失败";
        showError(message);
        state.previewError = message;
      }, true);
      let syncingConfig = false;
      const configWatch = setInterval(async () => {
        if (
          syncingConfig ||
          !state.config ||
          state.dirty ||
          state.busy ||
          state.saving ||
          document.hidden ||
          $("#dialog").open
        )
          return;
        syncingConfig = true;
        try {
          const fresh = await maibot.query("state");
          if (
            !state.dirty &&
            !state.busy &&
            !state.saving &&
            !$("#dialog").open &&
            fresh.config.revision !== state.config.revision
          ) {
            state.config = fresh.config;
            state.savedConfig = structuredClone(fresh.config);
            state.catalog = fresh.catalog;
            state.voiceSets = fresh.voice_sets;
            state.intonation = fresh.intonation;
            state.prompts = fresh.prompts;
            if (!current()) state.selected = state.config.profiles[0]?.id || "";
            render();
            notify("工作台已同步最新整体路由与配置。");
          }
        } catch (error) {
          notify("配置同步暂未完成：" + error.message, true);
        } finally {
          syncingConfig = false;
        }
      }, 10000);
      window.addEventListener("beforeunload", () => clearInterval(configWatch));
      (async () => {
        try {
          await maibot.ready;
          await refresh(true);
        } catch (e) {
          $("#view").innerHTML =
            `<div class="error-panel">无法初始化工作台：${h(e.message)}</div>`;
        }
      })();
    </script>
  </body>
</html>
